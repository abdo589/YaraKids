<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yara Kids</title>
<meta name="theme-color" content="#2a1840">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<style>
html,body{margin:0;background:#21122f}
#app{min-height:100vh}
.msg{padding:80px 20px;text-align:center;color:#fff}
</style>
</head>
<body>
<div class="yk" id="app"><p class="msg">جاري التحميل…</p></div>
<script src="config.js?v=3"></script>
<script src="render.js?v=3"></script>
<script>
{
  const app = document.getElementById('app');
  const get = u => fetch(u, {cache: 'no-store', headers: u.startsWith('http') ? {apikey: YK_CONFIG.key} : {}}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  get(YK_CONFIG.url + '/rest/v1/site?id=eq.1&select=data')
    .then(rows => { if (!rows[0]) throw new Error('empty'); return rows[0].data; })
    .catch(() => get('data.json?t=' + Date.now()))
    .then(d => { document.title = d.name || 'Yara Kids'; YK.render(d, app); })
    .catch(() => { app.innerHTML = '<p class="msg">حصلت مشكلة في التحميل، جرّب تعمل refresh.</p>'; });
}
</script>
</body>
</html>
