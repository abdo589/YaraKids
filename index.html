<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yara Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: مرح وأنيق، محل لبس أطفال
IDEA: نفس كارت الـ QR المطبوع، بس بيتلمس
PICTURE: اسم Yara Kids بألوان اليافطة فوق كونفيتي، وتحته الكروت
COLOUR and TYPE: بنفسجي غامق + أخضر/أزرق/بينك/أصفر، Baloo Bhaijaan 2
LAYOUT: عمود واحد 440px مناسب للموبايل
*/
:root{color-scheme:dark;--bg:#2a1840;--bg2:#21122f;--ink:#fff;--mute:rgba(255,255,255,.72);
--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--y:#ffd23f;--g:#3ecf4a;--b:#2f8cff;--p:#ff3d9a}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 "Baloo Bhaijaan 2",system-ui,sans-serif;overflow-x:clip;
background:radial-gradient(120% 60% at 50% 0%,#3b2158 0%,var(--bg) 55%,var(--bg2) 100%) fixed}
.conf{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:40px 18px 32px}
header{text-align:center}
.logo{display:block;width:104px;height:104px;border-radius:30px;object-fit:cover;margin:0 auto 16px;border:3px solid var(--y);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.mark{direction:ltr;font-size:clamp(46px,13vw,58px);font-weight:800;line-height:1;letter-spacing:1px;margin:0}
.mark span:nth-child(4n+1){color:var(--g)}.mark span:nth-child(4n+2){color:var(--b)}
.mark span:nth-child(4n+3){color:var(--p)}.mark span:nth-child(4n){color:var(--y)}
.mark i{display:inline-block;width:.28em}
.tag{margin:10px 0 0;color:var(--mute);font-size:17px}
h2{font-size:15px;font-weight:700;color:var(--y);margin:30px 6px 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);color:#fff;text-decoration:none;font-weight:700;font-size:18px;transition:transform .15s,background .15s}
.btn+.btn{margin-top:10px}
.btn:hover{background:rgba(255,255,255,.11)}
.btn:active{transform:scale(.98)}
.btn small{display:block;font-weight:500;font-size:13px;color:var(--mute);direction:ltr;text-align:right}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.ic svg{width:23px;height:23px}
.go{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--y)}
.ig{background:linear-gradient(45deg,#f58529,#dd2a7b 55%,#8134af)}.fb{background:#1877f2}.tt{background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.ip{background:#6c2bd9}.wl{background:#e60000}
.pay{background:#fff;color:#2a1840;border-radius:24px;padding:16px;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.pay+.pay{margin-top:12px}
.pay::before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--dot);opacity:.12}
.row{display:flex;align-items:center;gap:12px}
.lbl{font-weight:800;font-size:18px;line-height:1.2}
.small{font-size:13px;color:#76668a}
.num{direction:ltr;text-align:center;font-size:clamp(24px,8vw,30px);font-weight:800;letter-spacing:2px;margin:12px 0 12px;white-space:nowrap}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.acts>*{min-height:48px;border-radius:14px;border:0;font:700 16px "Baloo Bhaijaan 2",sans-serif;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.primary{background:#2a1840;color:#fff}
.ghost{background:#f2e9fc;color:#2a1840}
.one{grid-template-columns:1fr}
.btn:focus-visible,.acts>*:focus-visible{outline:3px solid var(--y);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:28px}
.toast{position:fixed;z-index:5;bottom:24px;left:50%;transform:translate(-50%,40px);opacity:0;background:var(--y);color:#2a1840;padding:10px 20px;border-radius:999px;font-weight:800;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
header{animation:pop .6s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  `<a class="btn" href="${s.u}" target="_blank" rel="noopener"><span class="ic ${s.k}">${I[s.k]}</span><span>${s.t}<small>${handle(s.u)}</small></span><span class="go">${I.go}</span></a>`
).join('');

const pays = [{k:'ip', title:'إنستاباي InstaPay', num:DATA.instapayNumber, dot:'#6c2bd9', link:DATA.instapayLink}]
  .concat(DATA.wallets.map((w,i) => ({k:'wl', title:'محفظة ' + w.name + (DATA.wallets.length > 1 ? ' ' + (i+1) : ''), num:w.number, dot:'#e60000'})));
$('pays').innerHTML = pays.map((p,i) => `<div class="pay" style="--dot:${p.dot}">
  <div class="row"><span class="ic ${p.k}">${I[p.k]}</span><div><div class="lbl">${p.title}</div><div class="small">حوّلي على الرقم ده</div></div></div>
  <div class="num">${p.num}</div>
  <div class="acts${p.k === 'ip' && !p.link ? ' one' : ''}">
    <button class="primary" data-i="${i}">انسخي الرقم</button>
    ${p.k === 'ip' ? (p.link ? `<a class="ghost" href="${p.link}" target="_blank" rel="noopener">افتحي إنستاباي</a>` : '') : `<a class="ghost" href="tel:${p.num}">اتصال</a>`}
  </div>
</div>`).join('');

const toast = $('toast'); let tm;
const show = m => { toast.textContent = m; toast.classList.add('on'); clearTimeout(tm); tm = setTimeout(() => toast.classList.remove('on'), 1600); };
document.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', async () => {
  const v = pays[+b.dataset.i].num;
  try { await navigator.clipboard.writeText(v); show('اتنسخ ✓ ' + v); } catch (e) { show(v); }
}));
}
</script>
</body>
</html>
