<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yara Kids</title>
<meta name="theme-color" content="#2a1840">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<style>
html,body{margin:0;background:#21122f}
#app{min-height:100vh}
.msg{padding:80px 20px;text-align:center;color:#fff}
</style>
</head>
<body>
<div class="yk" id="app"><p class="msg">جاري التحميل…</p></div>
<script src="render.js?v=2"></script>
<script>
{
  const app = document.getElementById('app');
  fetch('data.json?t=' + Date.now(), {cache: 'no-store'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { document.title = d.name || 'Yara Kids'; YK.render(d, app); })
    .catch(() => { app.innerHTML = '<p class="msg">حصلت مشكلة في التحميل، جرّب تعمل refresh.</p>'; });
}
</script>
</body>
</html>
